<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local CI/CD Runner (MVP)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Local CI/CD Runner MVP</h1>
    <div class="repo-config">
      <input type="text" id="repoPathInput" placeholder="Enter local repository absolute path (e.g. C:/path/to/repo)">
      <button id="loadWorkflowsBtn">Load Workflows</button>
    </div>
    <div id="statusMessage" class="info-message">No repository loaded.</div>
  </header>

  <main class="container">
    <!-- Left Column: Workflows Explorer -->
    <section class="panel list-panel">
      <h2>Detected Workflows</h2>
      <div id="workflowList" class="workflow-list">
        <!-- Workflows and jobs will be inserted here -->
        <p class="placeholder-text">Please load a repository first.</p>
      </div>
    </section>

    <!-- Right Column: Runner Control and Logs -->
    <section class="panel run-panel">
      <div class="run-header">
        <h2 id="activeJobTitle">No Job Selected</h2>
        <button id="runJobBtn" disabled>Run Job</button>
      </div>

      <!-- Steps status list -->
      <div class="steps-container">
        <h3>Job Steps</h3>
        <ul id="stepsList" class="steps-list">
          <li class="placeholder-text">Select a job to view its steps.</li>
        </ul>
      </div>

      <!-- Live Logs Terminal -->
      <div class="terminal-container">
        <div class="terminal-header">
          <h3>Execution Logs — <span id="logFilterLabel">All Steps</span></h3>
          <button id="showAllLogsBtn" class="btn-small">Show All Logs</button>
        </div>
        <pre id="logsTerminal">Logs will stream here in real time...</pre>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
